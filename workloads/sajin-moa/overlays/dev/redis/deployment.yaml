apiVersion: apps/v1
kind: Deployment
metadata:
  name: sajin-moa-redis
  labels:
    app.kubernetes.io/name: sajin-moa-redis
    app.kubernetes.io/component: redis
    app.kubernetes.io/part-of: sajin-moa

spec:
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: sajin-moa-redis

  template:
    metadata:
      labels:
        app.kubernetes.io/name: sajin-moa-redis
        app.kubernetes.io/component: redis
        app.kubernetes.io/part-of: sajin-moa

    spec:
      containers:
        - name: redis
          image: redis:8-alpine
          imagePullPolicy: IfNotPresent

          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP

          command:
            - redis-server

          args:
            - "--requirepass"
            - "$(REDIS_PASSWORD)"
            - "--appendonly"
            - "yes"
            - "--appendfsync"
            - "everysec"

          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sajin-moa-redis-secret
                  key: redis-password

          volumeMounts:
            - name: redis-data
              mountPath: /data

          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - redis-cli -a "$REDIS_PASSWORD" ping | grep PONG
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - redis-cli -a "$REDIS_PASSWORD" ping | grep PONG
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: sajin-moa-redis-pvc