apiVersion: apps/v1
kind: Deployment

metadata:
  name: sajin-moa-backend
  labels:
    app.kubernetes.io/name: sajin-moa-backend
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: sajin-moa

spec:
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: sajin-moa-backend

  template:
    metadata:
      labels:
        app.kubernetes.io/name: sajin-moa-backend
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: sajin-moa

    spec:
      containers:
        - name: backend

          # base에서는 Kustomize가 찾을 기준 이름만 사용
          image: docker.io/nhs0912/moa-backend
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          volumeMounts:
            - name: oci-private-key
              mountPath: /app/secrets/oci
              readOnly: true

          envFrom:
            - configMapRef:
                name: sajin-moa-config

          # Secret을 env로 추가할 경우 사용
          # - secretRef:
          #     name: sajin-moa-backend-secret

          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 18

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

      volumes:
        - name: oci-private-key
          secret:
            secretName: oci-private-key
            defaultMode: 0400

      terminationGracePeriodSeconds: 30