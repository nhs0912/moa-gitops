apiVersion: v1
kind: ConfigMap
metadata:
  name: sajin-moa-config
  labels:
    app.kubernetes.io/name: sajin-moa
    app.kubernetes.io/part-of: sajin-moa

data:
  SERVER_PORT: "8080"

  SPRING_PROFILES_ACTIVE: "dev"

  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info"
  MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED: "true"
  MANAGEMENT_HEALTH_LIVENESSSTATE_ENABLED: "true"
  MANAGEMENT_HEALTH_READINESSSTATE_ENABLED: "true"

  APP_UPLOAD_MAX_FILE_COUNT: "20"
  APP_UPLOAD_MAX_FILE_SIZE_MB: "15"

  LOGGING_LEVEL_ROOT: "INFO"
  LOGGING_LEVEL_COM_SAJINMOA: "INFO"

  TZ: "Asia/Seoul"