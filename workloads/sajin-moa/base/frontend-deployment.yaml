apiVersion: apps/v1
kind: Deployment
metadata:
  name: sajin-moa-frontend
  labels:
    app.kubernetes.io/name: sajin-moa-frontend
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: sajin-moa

spec:
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: sajin-moa-frontend

  template:
    metadata:
      labels:
        app.kubernetes.io/name: sajin-moa-frontend
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: sajin-moa

    spec:
      containers:
        - name: frontend
          image: docker.io/nhs0912/moa-frontend:latest
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 80
              protocol: TCP

          startupProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12

          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

      terminationGracePeriodSeconds: 15